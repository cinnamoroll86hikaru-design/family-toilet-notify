
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf2ff">
  <title>家族のトイレ通知</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eaf2ff;
      color: #29364a;
      font-family: sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      background: white;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 8px 30px #233b6020;
    }
    .icon { font-size: 60px; }
    h1 { font-size: 24px; }
    p { color: #778398; line-height: 1.8; }
    button {
      width: 100%;
      padding: 19px;
      border: 0;
      border-radius: 16px;
      background: #5489dc;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
    button:disabled { opacity: .45; }
    #status, #history {
      margin-top: 20px;
      padding: 14px;
      border-radius: 14px;
      background: #f1f5fb;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    #uid {
      font-size: 11px;
      overflow-wrap: anywhere;
      color: #778398;
    }
    .event {
      padding: 10px;
      margin-top: 8px;
      background: white;
      border-radius: 10px;
      text-align: left;
    }
  </style>
</head>
<body>
<main>
  <div class="icon">🚽</div>
  <h1>家族のトイレ通知</h1>
  <p>トイレを使いたいときに<br>ボタンを押して家族にお知らせ！</p>

  <button id="notify" disabled>トイレを使いたい！</button>
  <div id="status">ログイン準備中...</div>
  <div id="history">通知履歴はまだありません。</div>
  <p id="uid"></p>
</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp,
    query,
    orderBy,
    limit,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  // FirebaseのConfig情報をここに入れてね
  const firebaseConfig = {
    apiKey: "AIzaSyBH83-kUYRbKxIjd1TAvcL9p18u3vM4GLY",
    authDomain: "family-toilet-call-2e24c.firebaseapp.com",
    projectId: "family-toilet-call-2e24c",
    storageBucket: "family-toilet-call-2e24c.firebasestorage.app",
    messagingSenderId: "789262636034",
    appId: "1:789262636034:web:e770886d3f9c5be452c31b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const button = document.getElementById("notify");
  const status = document.getElementById("status");
  const history = document.getElementById("history");
  const uidDisplay = document.getElementById("uid");

  let currentUser = null;

  async function start() {
    try {
      await signInAnonymously(auth);
    } catch (error) {
      status.textContent = "ログインできませんでした。設定を確認してね。";
      console.error(error);
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;

    currentUser = user;
    uidDisplay.textContent = "この端末のユーザーID：" + user.uid;

    try {
      const memberRef = doc(db, "members", user.uid);
      const memberSnap = await getDoc(memberRef);

      if (!memberSnap.exists() || memberSnap.data().active !== true) {
        status.textContent =
          "家族登録がまだ完了していません。この端末のユーザーIDを管理者に伝えてね。";
        button.disabled = true;
        return;
      }

      status.textContent = "家族として接続しました！";
      button.disabled = false;

      const eventsRef = collection(db, "family", "toilet", "events");
      const eventsQuery = query(
        eventsRef,
        orderBy("createdAt", "desc"),
        limit(10)
      );

      onSnapshot(eventsQuery, (snapshot) => {
        history.innerHTML = "";

        if (snapshot.empty) {
          history.textContent = "通知履歴はまだありません。";
          return;
        }

        snapshot.forEach((item) => {
          const data = item.data();
          const entry = document.createElement("div");
          entry.className = "event";
          entry.textContent =
            data.senderUid === currentUser.uid
              ? "あなたが通知しました"
              : "🚽 家族からトイレの通知が届きました！";
          history.appendChild(entry);
        });
      }, (error) => {
        status.textContent = "通知の読み込みに失敗しました。";
        console.error(error);
      });

    } catch (error) {
      status.textContent = "家族登録を確認できませんでした。";
      console.error(error);
    }
  });

  button.addEventListener("click", async () => {
    if (!currentUser || button.disabled) return;

    button.disabled = true;
    status.textContent = "通知を送信中...";

    try {
      await addDoc(
        collection(db, "family", "toilet", "events"),
        {
          senderUid: currentUser.uid,
          createdAt: serverTimestamp()
        }
      );
      status.textContent = "家族に通知しました！";
    } catch (error) {
      status.textContent = "送信できませんでした。設定を確認してね。";
      console.error(error);
    } finally {
      button.disabled = false;
    }
  });

  start();
</script>
</body>
</html>
